[platformio]
default_envs = change_address

[env:change_address]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = amsky01
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0.5m
monitor_speed = 115200
upload_protocol = picotool

; Build only the address change utility
build_src_filter = 
    -<*>
    +<change_address_main.cpp>

build_flags =
    -DCHANGE_ADDRESS_MODE
