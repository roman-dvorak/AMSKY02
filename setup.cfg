[metadata]
name = amsky02
# version is supplied by setup.py
author = Roman Dvořák, AstroMeters
author_email = info@astrometers.eu
maintainer = Roman Dvořák
maintainer_email = info@astrometers.eu
description = Real-time viewer, logger and plotting tools for the AstroMeters AMSKY02 sky quality and cloud detection sensor
long_description = file: README_PyPI.md
long_description_content_type = text/markdown
url = https://github.com/roman-dvorak/AMSKY02
project_urls =
    Bug Reports = https://github.com/roman-dvorak/AMSKY02/issues
    Source = https://github.com/roman-dvorak/AMSKY02
    Documentation = https://astrometers.eu/docs/AMSKY/
    Product page = https://astrometers.eu/products/AMSKY02/
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Atmospheric Science
    Topic :: Scientific/Engineering :: Astronomy
    Topic :: System :: Monitoring
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Operating System :: OS Independent

[options]
package_dir =
    = sw
py_modules = amsky02_viewer, amsky02_cli, amsky02_plot
# PySide6 requires >= 3.9
python_requires = >=3.9
install_requires = file: requirements.txt

[options.extras_require]
dev =
    pytest>=6.0
    black>=21.0
    flake8>=3.8
    mypy>=0.910

[options.entry_points]
console_scripts =
    amsky02-viewer = amsky02_viewer:main
    amsky02-cli = amsky02_cli:main
    amsky02-plot = amsky02_plot:main
