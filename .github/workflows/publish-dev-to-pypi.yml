name: Publish dev build to PyPI

# Každý push do main vydá dev release (napr. 1.0.0.dev202608091530).
# Tag pushe sem nespadají — ty řeší publish-to-pypi.yml, protože
# "branches:" filtr se na refs/tags/* nevztahuje.
on:
  push:
    branches:
      - main
    # Jen cesty, které se do balíčku nepromítnou. README_PyPI.md tu
    # schválně není — je to long_description, tedy součást metadat.
    paths-ignore:
      - 'doc/**'
      - 'hw/**'
      - 'fw/**'
      # Webový prohlížeč se nasazuje samostatně (deploy-viewer.yml).
      - 'web/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual dev publish"
        required: false
        default: "manual"

# Když přijde víc pushů rychle po sobě, doběhne jen ten poslední.
concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Bump version to dev (in version.py)
        run: |
          python -m pip install --upgrade pip packaging
          python - <<'PY'
          import re, json, pathlib, datetime, urllib.request, urllib.error
          from packaging.version import Version

          p = pathlib.Path('version.py')
          s = p.read_text()
          m = re.search(r"__version__\s*=\s*\"([^\"]+)\"", s)
          if not m:
              raise SystemExit('version.py: __version__ not found')
          base = Version(re.sub(r"(\.dev.*|\+.*)$", "", m.group(1)))

          # X.Y.Z.devN je podle PEP 440 pre-release VERZE X.Y.Z, takže se
          # řadí PŘED ni. Kdyby base byla už vydaná, dev build by byl pro
          # pip starší než release a nikdy by se nenainstaloval ani s --pre.
          # Proto se base musí zvednout nad nejvyšší existující release.
          released = []
          try:
              req = urllib.request.Request(
                  'https://pypi.org/simple/amsky/',
                  headers={'Accept': 'application/vnd.pypi.simple.v1+json'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              released = [Version(v) for v in data.get('versions', [])]
          except urllib.error.HTTPError as e:
              if e.code != 404:      # 404 = projekt ještě neexistuje
                  raise
          finals = [v for v in released if not v.is_prerelease]

          if finals and base <= max(finals):
              rel = max(finals).release
              major, minor, micro = (list(rel) + [0, 0, 0])[:3]
              base = Version(f"{major}.{minor}.{micro + 1}")
              print(f'version.py je <= poslednimu releasu, dev build miri na {base}')

          ts = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d%H%M')
          # NOTE: PyPI odmítá lokální version segment PEP 440 ("+gabc1234"),
          # takže sem commit sha nepatří.
          new = f"{base}.dev{ts}"
          if finals:
              assert Version(new) > max(finals), f'{new} není novější než {max(finals)}'
          p.write_text(re.sub(r"__version__\s*=\s*\"[^\"]+\"", f'__version__ = "{new}"', s))
          print('Set dev version:', new)
          PY

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dev-distributions
          path: dist/

  pypi-publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/amsky

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dev-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
